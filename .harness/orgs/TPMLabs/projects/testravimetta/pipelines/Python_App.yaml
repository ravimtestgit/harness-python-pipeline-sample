pipeline:
  name: Python_App
  identifier: Python_App
  projectIdentifier: testravimetta
  orgIdentifier: TPMLabs
  tags: {}
  stages:
    - stage:
        name: Deploy_Dev
        identifier: Deploy_Dev
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: firstpythonservice
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: python_sample_ecr
                      sources:
                        - identifier: python_sample_ecr
                          type: Ecr
                          spec:
                            tag: <+codebase.commitSha>
          environment:
            environmentRef: DEV
            deployToAll: false
            infrastructureDefinitions:
              - identifier: deveks
          execution:
            steps:
              - step:
                  name: Rollout_Deployment
                  identifier: rolloutDeployment
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
            rollbackSteps:
              - step:
                  name: Rollback_Rollout_Deployment
                  identifier: rollbackRolloutDeployment
                  type: K8sRollingRollback
                  timeout: 10m
                  spec:
                    pruningEnabled: false
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        tags: {}
    - stage:
        name: Stage_Approval
        identifier: Stage_Approval
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  name: Approve_Stage_Deployment
                  identifier: Approve_Stage_Deployment
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: |-
                      Please approve deployment to Stage.

                      Application: firstpythonservice
                      Image tag: <+codebase.commitSha>
                      Branch: <+codebase.branch>
                      Commit: <+codebase.commitSha>
                    includePipelineExecutionHistory: true
                    isAutoRejectEnabled: true
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: false
                      userGroups:
                        - _project_all_users
    - stage:
        name: Deploy_Stage
        identifier: Deploy_Stage
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: firstpythonservice
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: python_sample_ecr
                      sources:
                        - identifier: python_sample_ecr
                          type: Ecr
                          spec:
                            tag: <+codebase.commitSha>
          environment:
            environmentRef: STAGE
            deployToAll: false
            infrastructureDefinitions:
              - identifier: stageeks
          execution:
            steps:
              - step:
                  name: Rollout_Deployment
                  identifier: rolloutDeployment
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
            rollbackSteps:
              - step:
                  name: Rollback_Rollout_Deployment
                  identifier: rollbackRolloutDeployment
                  type: K8sRollingRollback
                  timeout: 10m
                  spec:
                    pruningEnabled: false
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
