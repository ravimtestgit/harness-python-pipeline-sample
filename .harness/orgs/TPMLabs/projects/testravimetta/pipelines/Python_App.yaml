pipeline:
  name: Python_App
  identifier: Python_App
  projectIdentifier: testravimetta
  orgIdentifier: TPMLabs
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: ravigitconnector
        repoName: harness-python-pipeline-sample
        build: <+input>
  stages:
    - stage:
        name: Build_and_Test
        identifier: Build_and_Test
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
            paths:
              - /root/.cache/pip
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install_and_Test
                  identifier: Install_and_Test
                  spec:
                    connectorRef: ravidockerconnector
                    image: python:3.11
                    shell: Sh
                    command: |-
                      python --version
                      pip install --upgrade pip
                      pip install -r requirements.txt
                      mkdir -p test-results
                      pytest -v --junitxml=test-results/junit.xml
              - step:
                  type: Bandit
                  name: Security_Scan
                  identifier: Security_Scan
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: repository
                      detection: auto
                    advanced:
                      log:
                        level: info
              - step:
                  type: BuildAndPushECR
                  name: Build_And_Push_ECR
                  identifier: Build_And_Push_ECR
                  spec:
                    connectorRef: raviaws
                    region: us-east-2
                    account: "491085423717"
                    imageName: python-sample-app
                    dockerfile: Dockerfile
                    context: .
                    tags:
                      - <+codebase.commitSha>
                    caching: true
              - step:
                  type: Run
                  name: Build_Metadata
                  identifier: Build_Metadata
                  spec:
                    connectorRef: ravidockerconnector
                    image: alpine:3.19
                    shell: Sh
                    command: "echo \"Built image: 491085423717.dkr.ecr.us-east-2.amazonaws.com/python-sample-app:<+codebase.commitSha>\""
    - stage:
        name: Deploy_Dev
        identifier: Deploy_Dev
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: firstpythonservice
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: python_sample_ecr
                      sources:
                        - identifier: python_sample_ecr
                          type: Ecr
                          spec:
                            tag: <+codebase.commitSha>
          environment:
            environmentRef: DEV
            deployToAll: false
            infrastructureDefinitions:
              - identifier: deveks
          execution:
            steps:
              - step:
                  name: Rollout_Deployment
                  identifier: rolloutDeployment
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
            rollbackSteps:
              - step:
                  name: Rollback_Rollout_Deployment
                  identifier: rollbackRolloutDeployment
                  type: K8sRollingRollback
                  timeout: 10m
                  spec:
                    pruningEnabled: false
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        tags: {}
    - stage:
        name: Stage_Approval
        identifier: Stage_Approval
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  name: Approve_Stage_Deployment
                  identifier: Approve_Stage_Deployment
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: |-
                      Please approve deployment to Stage.

                      Application: firstpythonservice
                      Image tag: <+codebase.commitSha>
                      Branch: <+codebase.branch>
                      Commit: <+codebase.commitSha>
                    includePipelineExecutionHistory: true
                    isAutoRejectEnabled: true
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: false
                      userGroups:
                        - _project_all_users
    - stage:
        name: Deploy_Stage
        identifier: Deploy_Stage
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: firstpythonservice
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: python_sample_ecr
                      sources:
                        - identifier: python_sample_ecr
                          type: Ecr
                          spec:
                            tag: <+codebase.commitSha>
          environment:
            environmentRef: STAGE
            deployToAll: false
            infrastructureDefinitions:
              - identifier: stageeks
          execution:
            steps:
              - step:
                  name: Rollout_Deployment
                  identifier: rolloutDeployment
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
            rollbackSteps:
              - step:
                  name: Rollback_Rollout_Deployment
                  identifier: rollbackRolloutDeployment
                  type: K8sRollingRollback
                  timeout: 10m
                  spec:
                    pruningEnabled: false
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
