pipeline:
  name: Python App
  identifier: Python_App
  projectIdentifier: testravimetta
  orgIdentifier: TPMLabs
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: ravigitconnector
        repoName: harness-python-pipeline-sample
        build: <+input>
  stages:
    - stage:
        name: Build App
        identifier: Build_App
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: false
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - parallel:
                  - step:
                      type: Bandit
                      name: Security Scan
                      identifier: Security_Scan
                      spec:
                        mode: orchestration
                        config: default
                        target:
                          type: repository
                          detection: auto
                        advanced:
                          log:
                            level: info
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: BuildAndPushDockerRegistry_1
                      identifier: BuildAndPushDockerRegistry_1
                      spec:
                        connectorRef: ravidockerconnector
                        repo: rmettadocker/python-sample-pipelines
                        tags:
                          - <+codebase.commitSha>
                          - latest
                        caching: true
                  - step:
                      type: BuildAndPushECR
                      name: BuildAndPushECR_1
                      identifier: BuildAndPushECR_1
                      spec:
                        connectorRef: raviaws
                        region: us-east-2
                        account: "491085423717"
                        imageName: python-sample-app
                        tags:
                          - <+pipeline.sequenceId>
                        caching: true
    - stage:
        name: integration test
        identifier: integration_test
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: false
            paths: []
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Background
                  name: python server
                  identifier: python_server
                  spec:
                    connectorRef: ravidockerconnector
                    image: rmettadocker/python-sample-pipelines:<+codebase.commitSha>
                    shell: Sh
                  description: server connection
              - step:
                  type: Run
                  name: Connection Test
                  identifier: Connection_Test
                  spec:
                    connectorRef: ravidockerconnector
                    image: curlimages/curl:7.73.0
                    shell: Sh
                    command: |-
                      sleep 10
                      curl python_server:5000
